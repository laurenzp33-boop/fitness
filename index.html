<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05070d">
<meta name="color-scheme" content="dark">

<!-- iPhone: als App auf dem Homescreen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitness">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Hier wird der jeweilige Bildschirm hineingezeichnet -->
<main id="app"></main>

<!-- Pausen-Timer (schiebt sich von unten herein) -->
<div id="restbar"></div>

<!-- Untere Leiste. Die Symbole stehen direkt hier drin, damit beim Start
     nichts nachflackert. Dieselben Zeichnungen wie in js/icons.js. -->
<nav id="nav">
  <button data-go="#/start" aria-label="Start">
    <svg class="ic" viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3.2 10.5 12 3.6l8.8 6.9"/><path d="M5.5 9.2V20h13V9.2"/><path d="M9.8 20v-5.4h4.4V20"/></svg>
    <span>Start</span>
  </button>
  <button data-go="#/fortschritt" aria-label="Fortschritt">
    <svg class="ic" viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 19.2V4.8"/><path d="M4 19.2h15.5"/><path d="m7.5 15.2 3.4-4.2 3 2.4 4.1-5.6"/></svg>
    <span>Fortschritt</span>
  </button>
  <button data-go="#/plan" aria-label="Plan">
    <svg class="ic" viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4.2" y="3.6" width="15.6" height="16.8" rx="3.4"/>
      <path d="M8.2 9h7.6M8.2 12.6h7.6M8.2 16.2h4.6"/></svg>
    <span>Plan</span>
  </button>
  <button data-go="#/einstellungen" aria-label="Mehr">
    <svg class="ic" viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor"
      stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 6.6h14M5 12h14M5 17.4h14"/>
      <circle cx="9.4" cy="6.6" r="2.1" fill="currentColor" stroke="none"/>
      <circle cx="15" cy="12" r="2.1" fill="currentColor" stroke="none"/>
      <circle cx="8" cy="17.4" r="2.1" fill="currentColor" stroke="none"/></svg>
    <span>Mehr</span>
  </button>
</nav>

<!-- Dialoge, kurze Meldungen, Pokal -->
<div id="modal"></div>
<div id="toast"></div>
<div id="celebrate"></div>

<script src="js/util.js"></script>
<script src="js/icons.js"></script>
<script src="js/seed.js"></script>
<script src="js/db.js"></script>
<script src="js/logic.js"></script>
<script src="js/ui.js"></script>
<script src="js/timer.js"></script>
<script src="js/chart.js"></script>
<script src="js/screen-home.js"></script>
<script src="js/screen-workout.js"></script>
<script src="js/screen-progress.js"></script>
<script src="js/screen-plan.js"></script>
<script src="js/screen-settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
